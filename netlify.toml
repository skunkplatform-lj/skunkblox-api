[build]
functions = "netlify/functions"

[[redirects]]
from = "/"
to = "/hehe"
status = 200
force = false

[[redirects]]
from = "/catalog"
to = "/.netlify/functions/catalog-api"
status = 200
force = true

[[redirects]]
from = "/catalog/*"
to = "/.netlify/functions/catalog-api/*"
status = 200
force = true

[[redirects]]
from = "/friends/:uid"
to = "/.netlify/functions/ff-api/friends/:uid"
status = 200
force = true

[[redirects]]
from = "/bestfriends/:uid"
to = "/.netlify/functions/ff-api/bestfriends/:uid"
status = 200
force = true

[[redirects]]
from = "/bestfriends/request"
to = "/.netlify/functions/ff-api/bestfriends/request"
status = 200
force = true
